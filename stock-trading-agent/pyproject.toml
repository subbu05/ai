[project]
name = "stock-trading-agent"
version = "0.2.0"
description = "Skill-based automated trading agent for stocks, ETFs and options, driven by Claude"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.13", "mcp>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[tool.setuptools.packages.find]
include = ["trading_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
